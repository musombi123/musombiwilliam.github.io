name: Build and deploy portfolio with USB Field Kit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: portfolio-field-kit-build
  cancel-in-progress: true

jobs:
  build-site:
    name: Build website and Windows USB download
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Validate first-party browser assets
        shell: pwsh
        run: |
          $required = @("index.html", "forensics.html", "fieldkit.html", "fieldkit.js", "diagnostics.html", "diagnostics.css", "diagnostics.js", "guides.html", "stylesheet.css")
          foreach ($relativePath in $required) {
            $fullPath = Join-Path $env:GITHUB_WORKSPACE $relativePath
            if (!(Test-Path $fullPath)) {
              throw "Required website file is missing: $relativePath"
            }
          }
          node --check (Join-Path $env:GITHUB_WORKSPACE "fieldkit.js")
          if ($LASTEXITCODE -ne 0) {
            throw "Field Workbench JavaScript syntax validation failed."
          }
          node --check (Join-Path $env:GITHUB_WORKSPACE "diagnostics.js")
          if ($LASTEXITCODE -ne 0) {
            throw "Workspace Diagnostics JavaScript syntax validation failed."
          }
          node --check (Join-Path $env:GITHUB_WORKSPACE "site.js")
          if ($LASTEXITCODE -ne 0) {
            throw "Shared portfolio JavaScript syntax validation failed."
          }
          node (Join-Path $env:GITHUB_WORKSPACE "scripts/validate-static-site.mjs")
          if ($LASTEXITCODE -ne 0) {
            throw "Static portfolio validation failed."
          }

      - name: Prepare static website directory
        shell: pwsh
        run: |
          $site = Join-Path $env:RUNNER_TEMP "portfolio-site"
          New-Item -ItemType Directory -Force -Path $site | Out-Null
          robocopy $env:GITHUB_WORKSPACE $site /E /XD .git .github
          $copyExitCode = $LASTEXITCODE
          if ($copyExitCode -gt 7) {
            throw "Failed to stage portfolio files (robocopy exit $copyExitCode)."
          }
          # Robocopy uses codes 1–7 for successful copies with differences.
          # Clear the native exit code so pwsh does not report a successful copy as job failure.
          $global:LASTEXITCODE = 0
          New-Item -ItemType Directory -Force -Path (Join-Path $site "downloads") | Out-Null
          "Portfolio staged at $site"

      - name: Fetch pinned RevelaAI Field Kit source
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "RevelaAI-source"
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          git -C $source init
          git -C $source remote add origin https://github.com/musombi123/RevelaAI.git
          git -C $source fetch --depth 1 origin 1a3f584b8c25426d564bc59376c9cd6a4cca55ce
          git -C $source checkout --detach FETCH_HEAD
          $actual = (git -C $source rev-parse HEAD).Trim()
          if ($actual -ne "1a3f584b8c25426d564bc59376c9cd6a4cca55ce") {
            throw "Unexpected Field Kit source revision: $actual"
          }
          "Pinned Field Kit revision: $actual"

      - name: Set up Go for the native Windows Field Engine
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Build the native Field Engine and bundle USECT core runtime
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "RevelaAI-source"
          $bin = Join-Path $source "portable/bin/windows-amd64"
          $runtimeSource = Join-Path $source "portable/runtime-source"
          New-Item -ItemType Directory -Force -Path $bin, $runtimeSource | Out-Null

          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"

          $builds = @(
            @{ Module = "portable/native"; Package = "./cmd/revela-field"; Output = "revela-field.exe" },
            @{ Module = "core-zero"; Package = "./cmd/usect-zero"; Output = "usect-zero.exe" },
            @{ Module = "core-one"; Package = "./cmd/genesis"; Output = "revela-genesis.exe" },
            @{ Module = "core-two"; Package = "./cmd/revela-mind"; Output = "revela-mind.exe" }
          )

          Push-Location $source
          try {
            foreach ($build in $builds) {
              $output = Join-Path $bin $build.Output
              & go -C $build.Module build -trimpath "-ldflags=-s -w" -o $output $build.Package
              if ($LASTEXITCODE -ne 0) {
                throw "Native build failed: $($build.Module) $($build.Package)"
              }
              if (!(Test-Path $output)) {
                throw "Native build did not produce $($build.Output)"
              }
            }
          } finally {
            Pop-Location
          }

          foreach ($directory in @("core-zero", "core-one", "core-two", "lib")) {
            Copy-Item -Path (Join-Path $source $directory) -Destination $runtimeSource -Recurse -Force
          }

          $required = @(
            "revela-field.exe", "usect-zero.exe", "revela-genesis.exe", "revela-mind.exe"
          )
          foreach ($name in $required) {
            if (!(Test-Path (Join-Path $bin $name))) {
              throw "Required USB executable is missing: $name"
            }
          }

          $policyFiles = @(
            "core-zero/go.mod",
            "core-zero/guardian/rules.yaml",
            "core-zero/guardian/worldwide_rules.yaml",
            "core-one/go.mod",
            "core-one/guardian/rules.yaml",
            "core-two/go.mod",
            "core-two/guardian/rules.yaml"
          )
          foreach ($relativePath in $policyFiles) {
            if (!(Test-Path (Join-Path $runtimeSource $relativePath))) {
              throw "USB core runtime source is incomplete: $relativePath"
            }
          }

          $engine = Join-Path $bin "revela-field.exe"
          & $engine version
          if ($LASTEXITCODE -ne 0) { throw "Native Field Engine smoke test failed." }
          $doctorPath = Join-Path $env:RUNNER_TEMP "revela-field-doctor.json"
          & $engine doctor | Set-Content -Path $doctorPath -Encoding UTF8
          if ($LASTEXITCODE -ne 0) { throw "Native Field Engine doctor command failed." }
          $doctor = Get-Content -Raw -Path $doctorPath | ConvertFrom-Json
          if ($doctor.version -ne "0.3.0" -or $doctor.core_binaries.Count -ne 3) {
            throw "Native Field Engine doctor response is incomplete."
          }
          if (@($doctor.core_binaries | Where-Object { -not $_.present }).Count -ne 0) {
            throw "One or more bundled USECT core binaries were not detected."
          }

          "Built all four Windows x64 executables and staged the matching USECT source/policies."

      - name: Prepare and verify embedded Windows runtime
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "RevelaAI-source"
          & (Join-Path $source "portable/prepare-windows-runtime.ps1")
          $python = Join-Path $source "portable/runtimes/python-win-x64/python.exe"
          if (!(Test-Path $python)) {
            throw "Embedded Python runtime was not created."
          }
          & $python --version
          if ($LASTEXITCODE -ne 0) {
            throw "Embedded Python runtime failed its version check."
          }

      - name: Run Field Kit tests on embedded Python
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "RevelaAI-source"
          $python = Join-Path $source "portable/runtimes/python-win-x64/python.exe"
          $env:PYTHONPATH = Join-Path $source "portable/src"
          Push-Location $source
          try {
            & $python -m unittest discover -s portable/tests -v
            if ($LASTEXITCODE -ne 0) {
              throw "Field Kit Windows test suite failed."
            }
          } finally {
            Pop-Location
          }

      - name: Package and checksum USB Edition
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "RevelaAI-source"
          $site = Join-Path $env:RUNNER_TEMP "portfolio-site"
          $stage = Join-Path $env:RUNNER_TEMP "fieldkit-package"
          $portable = Join-Path $source "portable"
          $filename = "RevelaAI-Portable-Field-Kit-v0.3.0-Windows-x64.zip"
          $downloads = Join-Path $site "downloads"
          $stagePortable = Join-Path $stage "portable"

          New-Item -ItemType Directory -Force -Path $stagePortable | Out-Null
          Copy-Item -Path (Join-Path $portable "*") -Destination $stagePortable -Recurse -Force

          $requiredBinaries = @(
            "bin/windows-amd64/revela-field.exe",
            "bin/windows-amd64/usect-zero.exe",
            "bin/windows-amd64/revela-genesis.exe",
            "bin/windows-amd64/revela-mind.exe"
          )
          foreach ($relativePath in $requiredBinaries) {
            if (!(Test-Path (Join-Path $stagePortable $relativePath))) {
              throw "USB package is missing native executable: $relativePath"
            }
          }

          $requiredRuntimeFiles = @(
            "runtime-source/core-zero/go.mod",
            "runtime-source/core-zero/guardian/rules.yaml",
            "runtime-source/core-zero/guardian/worldwide_rules.yaml",
            "runtime-source/core-one/go.mod",
            "runtime-source/core-one/guardian/rules.yaml",
            "runtime-source/core-two/go.mod",
            "runtime-source/core-two/guardian/rules.yaml"
          )
          foreach ($relativePath in $requiredRuntimeFiles) {
            if (!(Test-Path (Join-Path $stagePortable $relativePath))) {
              throw "USB package is missing required core runtime source: $relativePath"
            }
          }

          $binaryRoot = Join-Path $stagePortable "bin"
          $binaryHashes = Get-ChildItem -Path $binaryRoot -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $relative = $_.FullName.Substring($stagePortable.Length + 1).Replace('\x5c', '/')
              "$hash  $relative"
            }
          [System.IO.File]::WriteAllText(
            (Join-Path $binaryRoot "SHA256SUMS.txt"),
            ($binaryHashes -join [Environment]::NewLine) + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false)
          )

          $tests = Join-Path $stagePortable "tests"
          if (Test-Path $tests) { Remove-Item $tests -Recurse -Force }
          Get-ChildItem -Path $stagePortable -Directory -Filter "__pycache__" -Recurse |
            Remove-Item -Recurse -Force
          Get-ChildItem -Path $stagePortable -File -Filter "*.pyc" -Recurse |
            Remove-Item -Force

          $zipPath = Join-Path $downloads $filename
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $stagePortable "*") -DestinationPath $zipPath -CompressionLevel Optimal

          $digest = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $zipPath).Length
          $shaLine = "$digest  $filename"
          [System.IO.File]::WriteAllText(
            (Join-Path $downloads "SHA256SUMS.txt"),
            $shaLine + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false)
          )

          $manifest = [ordered]@{
            product = "RevelaAI Portable Field Kit"
            version = "0.3.0"
            platform = "Windows x64"
            source_repository = "musombi123/RevelaAI"
            source_commit = "1a3f584b8c25426d564bc59376c9cd6a4cca55ce"
            package_file = $filename
            package_size_bytes = $size
            sha256 = $digest
            runtime = "Embedded Python 3.14.10"
            native_engine = "Revela Field Engine 0.3.0 Windows x64"
            bundled_cores = @("USECT ZERO", "Genesis Core-ONE", "Infinite Mind Core-TWO")
            bundled_core_source = $true
            tested = $true
            generated_at_utc = (Get-Date).ToUniversalTime().ToString("o")
          }
          $json = $manifest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText(
            (Join-Path $downloads "fieldkit-release.json"),
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )

          "Published package: $zipPath"
          "Size bytes: $size"
          "SHA-256: $digest"

      - name: Upload complete portfolio site
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-pages-site
          path: ${{ runner.temp }}\portfolio-site
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    name: Deploy portfolio to GitHub Pages
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download built portfolio site
        uses: actions/download-artifact@v4
        with:
          name: portfolio-pages-site
          path: site

      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
